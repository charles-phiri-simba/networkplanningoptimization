services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snip
      POSTGRES_USER: snip
      POSTGRES_PASSWORD: ${SNIP_DB_PASSWORD:-snip}
    ports:
      - "127.0.0.1:${SNIP_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snip -d snip"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - snip-postgres:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "127.0.0.1:${SNIP_HOST_PORT:-8080}:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SNIP_GENERATOR: stub
      SNIP_RETRIEVAL_MODE: lexical
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/snip
      SPRING_DATASOURCE_USERNAME: snip
      SPRING_DATASOURCE_PASSWORD: ${SNIP_DB_PASSWORD:-snip}
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    profiles: ["local-ai"]

  api-local:
    build: .
    ports:
      - "127.0.0.1:${SNIP_HOST_PORT:-8080}:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: local-ai
      OLLAMA_BASE_URL: http://ollama:11434
      SNIP_CHAT_MODEL: qwen2.5:7b
      SNIP_EMBEDDING_MODEL: nomic-embed-text
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/snip
      SPRING_DATASOURCE_USERNAME: snip
      SPRING_DATASOURCE_PASSWORD: ${SNIP_DB_PASSWORD:-snip}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    profiles: ["local-ai"]

volumes:
  snip-postgres:
  ollama-data:
