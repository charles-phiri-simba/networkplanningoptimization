services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snip
      POSTGRES_USER: snip
      POSTGRES_PASSWORD: ${SNIP_DB_PASSWORD:-snip}
    ports:
      - "127.0.0.1:${SNIP_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snip -d snip"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - snip-postgres:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "127.0.0.1:${SNIP_HOST_PORT:-8080}:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SNIP_GENERATOR: stub
      SNIP_RETRIEVAL_MODE: lexical
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/snip
      SPRING_DATASOURCE_USERNAME: snip
      SPRING_DATASOURCE_PASSWORD: ${SNIP_DB_PASSWORD:-snip}
      SNIP_KAFKA_ENABLED: ${SNIP_KAFKA_ENABLED:-false}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.8.1
    profiles: ["telemetry"]
    hostname: kafka
    ports:
      - "127.0.0.1:${SNIP_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:${SNIP_KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  simulator:
    build: ./simulator
    profiles: ["telemetry"]
    environment:
      SNIP_KAFKA_BROKERS: kafka:29092
      SNIP_SCENARIO: ${SNIP_SCENARIO:-high-bler-load}
      SNIP_TELEMETRY_TOPIC: snip.telemetry.cell-kpi.v1
    depends_on:
      kafka:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    profiles: ["local-ai"]

  api-local:
    build: .
    ports:
      - "127.0.0.1:${SNIP_HOST_PORT:-8080}:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: local-ai
      OLLAMA_BASE_URL: http://ollama:11434
      SNIP_CHAT_MODEL: qwen2.5:7b
      SNIP_EMBEDDING_MODEL: nomic-embed-text
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/snip
      SPRING_DATASOURCE_USERNAME: snip
      SPRING_DATASOURCE_PASSWORD: ${SNIP_DB_PASSWORD:-snip}
      SNIP_KAFKA_ENABLED: ${SNIP_KAFKA_ENABLED:-false}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    profiles: ["local-ai"]

volumes:
  snip-postgres:
  ollama-data:
