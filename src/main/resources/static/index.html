<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SNIP Phase 2 — Planning copilot</title>
    <style>
        body { font-family: sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
        textarea, input, button { width: 100%; box-sizing: border-box; margin: 0.4rem 0; padding: 0.5rem; }
        pre { background: #f4f4f4; padding: 1rem; overflow: auto; white-space: pre-wrap; }
        .muted { color: #555; }
    </style>
</head>
<body>
<h1>SNIP Phase 2 — read-only planning copilot</h1>
<p class="muted">Recommendations only. Nothing is written to the live network. CELL-001 context and telemetry are synthetic demo data.</p>
<label for="question">Question</label>
<textarea id="question" rows="4">What is happening on CELL-001, and what should I investigate?</textarea>
<label for="cellId">Cell id (structured context)</label>
<input id="cellId" value="CELL-001">
<label for="contextId">Legacy synthetic KPI context id (optional)</label>
<input id="contextId" value="">
<button id="ask" type="button">Ask</button>
<pre id="out">Submit a question to see a cited recommendation.</pre>
<script>
    document.getElementById("ask").addEventListener("click", async () => {
        const out = document.getElementById("out");
        out.textContent = "Working…";
        try {
            const body = {
                question: document.getElementById("question").value,
                cellId: document.getElementById("cellId").value || null,
                contextId: document.getElementById("contextId").value || null
            };
            const res = await fetch("/api/v1/recommendations", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            const json = await res.json();
            out.textContent = JSON.stringify(json, null, 2);
        } catch (err) {
            out.textContent = String(err);
        }
    });
</script>
</body>
</html>
