server:
  address: 127.0.0.1
  port: 8080

snip:
  corpus-dir: testdata/corpus
  kpi-file: testdata/kpis.json
  generator: stub
  retrieval-mode: lexical
  retrieve-top-k: 3
  retrieve-min-score: 0.45
  chat-model: qwen2.5:7b
  embedding-model: nomic-embed-text
  recent-kpi-hours: 168
  recent-kpi-limit: 20

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/snip}
    username: ${SPRING_DATASOURCE_USERNAME:snip}
    password: ${SPRING_DATASOURCE_PASSWORD:snip}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  ai:
    model:
      chat: none
      embedding: none

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId}] %logger{36} - %msg%n"
