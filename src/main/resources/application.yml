server:
  address: 127.0.0.1
  port: 8080

snip:
  corpus-dir: testdata/corpus
  kpi-file: testdata/kpis.json
  generator: stub
  retrieval-mode: lexical
  retrieve-top-k: 3
  retrieve-min-score: 0.45
  chat-model: qwen2.5:7b
  embedding-model: nomic-embed-text
  recent-kpi-hours: 168
  recent-kpi-limit: 20
  telemetry-history-n: 5
  kafka-enabled: ${SNIP_KAFKA_ENABLED:false}
  telemetry-topic: snip.telemetry.cell-kpi.v1
  telemetry-dlq-topic: snip.telemetry.cell-kpi.dlq.v1
  kafka-retry-attempts: 2
  kafka-retry-interval-ms: 200
  assurance-bler-dl-threshold: 0.08
  assurance-bler-dl-major-threshold: 0.10
  assurance-bler-dl-critical-threshold: 0.12
  mcp-base-url: ${SNIP_MCP_BASE_URL:}
  mcp-timeout-ms: 3000
  agent-max-steps: 8
  agent-max-agent-calls: 10
  agent-max-total-model-calls: 20
  agent-max-retries-per-step: 1
  agent-max-proposed-actions: 2
  agent-per-agent-timeout-ms: 8000
  agent-overall-run-timeout-ms: 30000
  agent-force-fail-agent-id: ${SNIP_AGENT_FORCE_FAIL:}
  twin-expired-hours: 24
  integration:
    lease-duration: 30s
    heartbeat-interval: 5s
    execution-timeout: 120s
    fixture-read-delay: 0s

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/snip}
    username: ${SPRING_DATASOURCE_USERNAME:snip}
    password: ${SPRING_DATASOURCE_PASSWORD:snip}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    listener:
      auto-startup: ${SNIP_KAFKA_ENABLED:false}
    consumer:
      group-id: snip-npo-telemetry
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  ai:
    model:
      chat: none
      embedding: none

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId}] %logger{36} - %msg%n"
