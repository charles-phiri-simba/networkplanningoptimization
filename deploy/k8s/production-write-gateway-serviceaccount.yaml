apiVersion: v1
kind: ServiceAccount
metadata:
  name: production-write-gateway
  namespace: snip
  annotations:
    azure.workload.identity/client-id: "${SNIP_PRODUCTION_WRITE_UAMI_CLIENT_ID}"
  labels:
    azure.workload.identity/use: "true"
    app: production-write-gateway
# Distinct write-gateway identity. Do not reuse the application connector service account.
automountServiceAccountToken: true
