apiVersion: v1
kind: ServiceAccount
metadata:
  name: snip-connector-runtime
  namespace: snip
  annotations:
    azure.workload.identity/client-id: "${SNIP_CONNECTOR_UAMI_CLIENT_ID}"
  labels:
    azure.workload.identity/use: "true"
# Workload Identity uses a short-lived projected token. Do not create a
# kubernetes.io/service-account-token Secret for this account.
automountServiceAccountToken: true
