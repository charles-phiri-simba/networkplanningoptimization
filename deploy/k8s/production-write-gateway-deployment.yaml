apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-write-gateway
  namespace: snip
  labels:
    app: production-write-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: production-write-gateway
  template:
    metadata:
      labels:
        app: production-write-gateway
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: production-write-gateway
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: production-write-gateway:phase16
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SNIP_PRODUCTION_CHANGE_ENABLED
              value: "false"
            - name: SNIP_PRODUCTION_CHANGE_GLOBAL_EXECUTION_ENABLED
              value: "false"
            - name: SNIP_PRODUCTION_CHANGE_TEST_TRANSPORT_ENABLED
              value: "false"
            - name: SNIP_PRODUCTION_CHANGE_FAILURE_INJECTION_ENABLED
              value: "false"
            - name: SNIP_PRODUCTION_RUNTIME
              value: "true"
            - name: SNIP_PRODUCTION_CHANGE_SSL_TRUST_ALL
              value: "false"
            - name: SNIP_PRODUCTION_CHANGE_SSL_HOSTNAME_VERIFICATION
              value: "true"
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
