server:
  address: 127.0.0.1
  port: 8081

snip:
  production-change:
    enabled: false
    global-execution-enabled: false
    test-transport-enabled: false
    failure-injection:
      enabled: false
    ssl:
      hostname-verification: true
      trust-all: false
    gateway:
      allowed-caller-ids:
        - snip-npo-app
      instance-id: ${HOSTNAME:gateway-local}
    credentials:
      enabled: false
      vault-uri: ${SNIP_PRODUCTION_WRITE_KEY_VAULT_URI:}
      authentication: WORKLOAD_IDENTITY
    maximum-cells-per-execution: 1
    maximum-parameters-per-execution: 1
    maximum-operations-per-execution: 1
    maximum-forward-grant-ttl: PT5M
    maximum-rollback-grant-ttl: PT5M
    maximum-changes-per-target-per-hour: 6
    maximum-changes-per-cell-per-day: 3
    maximum-outcome-unknown-before-suspend: 3
    maximum-verification-failures-before-suspend: 3
    require-current-value-match: true
    require-independent-verification: true
    automatic-rollback-enabled: false
    permitted-vendors:
      - ERICSSON
    permitted-platforms:
      - ENM
    minimum-certification-level-for-execution: L0
  integration:
    security:
      production-runtime: ${SNIP_PRODUCTION_RUNTIME:false}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/snip}
    username: ${SPRING_DATASOURCE_USERNAME:snip}
    password: ${SPRING_DATASOURCE_PASSWORD:snip}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId}] %logger{36} - %msg%n"
