name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: simulator/go.sum
      - name: Go tests
        working-directory: simulator
        run: go test ./...
      - name: Maven tests
        run: mvn -B test
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: snip-web/package-lock.json
      - name: Frontend install
        working-directory: snip-web
        run: npm ci
      - name: Frontend tests
        working-directory: snip-web
        run: npm test
      - name: Frontend build
        working-directory: snip-web
        run: npm run build
