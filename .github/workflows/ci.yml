name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: simulator/go.sum
      - name: Go tests
        working-directory: simulator
        run: go test ./...
      - name: Maven tests
        run: mvn -B test
